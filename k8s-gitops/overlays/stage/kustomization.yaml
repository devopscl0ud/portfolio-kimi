apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio-stage

resources:
- ../../base
- httproute.yaml

commonLabels:
  env: stage
  tier: preview

replicas:
- name: portfolio
  count: 2

images:
- name: portfolio
  newName: docker.io/bandiops/portfolio
  newTag: stage-latest

configMapGenerator:
- name: portfolio-config
  behavior: merge
  literals:
  - ENV=staging
