apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-prod-route
  labels:
    env: prod
spec:
  parentRefs:
  - name: portfolio-gateway
    namespace: portfolio-prod
  hostnames:
  - "venkatesh.portfolio.vividp.cloud"  # Fixed production domain
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: portfolio-service
      port: 80
