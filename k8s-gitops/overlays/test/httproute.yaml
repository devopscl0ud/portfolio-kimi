apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-test-route
  labels:
    env: preview
spec:
  parentRefs:
  - name: portfolio-gateway
    namespace: portfolio-prod
  hostnames:
  - "test-PLACEHOLDER.portfolio.vividp.cloud"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: portfolio-service
      port: 80
