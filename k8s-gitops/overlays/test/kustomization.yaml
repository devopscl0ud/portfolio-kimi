apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio-test

resources:
- ../../base
- httproute.yaml

commonLabels:
  env: test
  tier: preview

replicas:
- name: portfolio
  count: 1

images:
- name: portfolio
  newName: docker.io/bandiops/portfolio
  newTag: test-latest

configMapGenerator:
- name: portfolio-config
  behavior: merge
  literals:
  - ENV=test
