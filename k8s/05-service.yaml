apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio
  labels:
    app: portfolio
spec:
  type: LoadBalancer  # Change to LoadBalancer for cloud, NodePort for local
  selector:
    app: portfolio
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
    # nodePort: 30080  # Uncomment for NodePort type
  sessionAffinity: ClientIP
