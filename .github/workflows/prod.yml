name: Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/portfolio

jobs:
  build-and-deploy:
    runs-on: [self-hosted, gke]
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get tag version
      id: tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
          ${{ env.IMAGE_NAME }}:latest
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
        cache-to: type=inline
    
    - name: Update Kustomize
      run: |
        cd k8s-gitops/overlays/prod
        kustomize edit set image portfolio=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
    
    - name: Commit changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add k8s-gitops/overlays/prod/
        git commit -m "Release ${{ steps.tag.outputs.VERSION }}"
        git push origin HEAD:main
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.VERSION }}
        release_name: Release ${{ steps.tag.outputs.VERSION }}
        body: |
          ## 🚀 Production Release ${{ steps.tag.outputs.VERSION }}
          
          **Image**: `${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}`
          **URL**: https://venkatesh.portfolio.vividp.cloud
          
          ### Deployment
          - ArgoCD will sync automatically
          - Manual approval required in ArgoCD
        draft: false
        prerelease: false
    
    - name: Notification
      run: |
        echo "### 🎉 Production Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.tag.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: https://venkatesh.portfolio.vividp.cloud" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**⚠️ ArgoCD Manual Sync Required**" >> $GITHUB_STEP_SUMMARY
