apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devopscl0ud/portfolio-kimi.git
    targetRevision: main  # Track main branch for prod
    path: k8s-gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-prod
  syncPolicy:
    # Manual sync for production
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
