apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portfolio-gateway
  namespace: portfolio-prod
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  # HTTP listener (redirects to HTTPS)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  # HTTPS listener for production
  - name: https-prod
    protocol: HTTPS
    port: 443
    hostname: "venkatesh.portfolio.vividp.cloud"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: portfolio-prod-cert
