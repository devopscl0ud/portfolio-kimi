apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portfolio-gateway
  namespace: portfolio-prod
  annotations:
    networking.gke.io/certmap: portfolio-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  # HTTP listener (redirects to HTTPS)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  # HTTPS listener for production
  - name: https-prod
    protocol: HTTPS
    port: 443
    hostname: "venkatesh.portfolio.vividp.cloud"
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            env: prod
    tls:
      mode: Terminate
      certificateRefs:
      - name: portfolio-prod-cert
  # HTTPS listener for dev/test/stage wildcards
  - name: https-preview
    protocol: HTTPS
    port: 443
    hostname: "*.portfolio.vividp.cloud"
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            env: preview
    tls:
      mode: Terminate
      certificateRefs:
      - name: portfolio-wildcard-cert
