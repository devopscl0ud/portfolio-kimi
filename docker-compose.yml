version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time environment variables
        VITE_PORTFOLIO_EMAIL: bandivenky2222@gmail.com
        VITE_PORTFOLIO_GITHUB: https://github.com/devopscl0ud
        VITE_PORTFOLIO_LINKEDIN: https://linkedin.com/in/bandi-venkatesh
        # VITE_AI_API_KEY: your_api_key_here  # Uncomment if using AI
    container_name: portfolio-venkatesh
    ports:
      - "80:80"
    restart: unless-stopped
    labels:
      - "com.portfolio.description=Bandi Venkatesh Portfolio"
      - "com.portfolio.version=2.0.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
